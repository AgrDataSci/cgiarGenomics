# Runs the unit tests and R CMD check on every push and pull request.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: tests

permissions: read-all

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::rcmdcheck
          needs: check

      - name: Document (temporary step)
        run: |
          unlink(list.files("man", full.names = TRUE))
          roxygen2::roxygenise()
          system("tar czf /tmp/doc.tgz man NAMESPACE && echo DOC_BEGIN && base64 -w 76 /tmp/doc.tgz && echo DOC_END")
        shell: Rscript {0}

      - name: Run tests
        if: always()
        run: devtools::test(stop_on_failure = TRUE)
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        if: always()
        with:
          args: 'c("--no-manual")'
          error-on: '"error"'
