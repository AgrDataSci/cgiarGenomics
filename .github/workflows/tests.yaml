# Runs the unit tests and R CMD check on every push and pull request.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: tests

permissions: read-all

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::rcmdcheck
          needs: check

      - name: Check that NAMESPACE and man/ match the roxygen comments
        run: |
          roxygen2::roxygenise()
          changed = system("git status --porcelain -- NAMESPACE man", intern = TRUE)
          if (length(changed) > 0) {
            system("git diff -- NAMESPACE man")
            system("git ls-files --others --exclude-standard man | xargs -r tail -n +1")
            stop("Run devtools::document() and commit NAMESPACE and man/.")
          }
        shell: Rscript {0}

      - name: Run tests
        if: always()
        run: devtools::test(stop_on_failure = TRUE)
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
